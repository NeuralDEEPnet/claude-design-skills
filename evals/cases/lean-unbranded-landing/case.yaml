schema_version: "1.1"
name: lean-unbranded-landing
expected_outcome: |
  Chooses Rapid depth for an unbranded single-page ask, adopts the clean default character and says so, ships one self-contained HTML page with one accent, one type family, light and dark themes at AA contrast, fragment headlines and verb buttons, runs the reduction pass, and keeps the chat response under 400 words with an honest render statement. Adjectives alone do not open the heritage gate: the run opens none of heritage.md, heritage-ledger.md, proportion.md or modern-platform.md (grader 10), and neither reply nor page names a design school, designer, company or award (grader 11).
