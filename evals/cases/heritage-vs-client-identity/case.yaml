schema_version: "1.1"
name: heritage-vs-client-identity
expected_outcome: |
  Client identity wins over a named tradition: the gold accent and the ornamental divider stay, the response surfaces the client-identity-versus-tradition tension with the default taken and what would reverse it, takes Bauhaus principles (not period devices), makes no 'Bauhaus style' claim, and states Gropius's 1925 position on ornament accurately (ornament only if functionally justified, not an absolute ban).
