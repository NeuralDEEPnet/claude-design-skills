schema_version: "1.1"
name: heritage-vs-client-identity
expected_outcome: |
  Client identity wins over a named tradition: the gold accent, the flourish divider and the footer crest stay, the typefaces and palette stay the client's, the response states the default taken (client identity wins, principles only) and what would reverse it, takes a Bauhaus principle with a rejection example and names a period device it does not copy, keeps the word Bauhaus out of page copy and file name, makes no 'Bauhaus style' claim, and states Gropius's 1925 position on ornament accurately (only where functionally justified, not an absolute ban), and asks at most one question.
