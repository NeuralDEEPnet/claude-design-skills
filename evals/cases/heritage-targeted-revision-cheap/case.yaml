schema_version: "1.1"
name: heritage-targeted-revision-cheap
expected_outcome: |
  A targeted revision stays cheap even when a tradition is named (gate stays shut: the change does not adopt or alter the tradition): no reference file is opened, the reply is a short note (about 120 words: what changed, what was checked), the approved brief and DNA are reused, only the button spacing declarations change, the output is inspected and the reply says how, and the reply carries no strand line, tension list, declared-set block or Bauhaus claim.
