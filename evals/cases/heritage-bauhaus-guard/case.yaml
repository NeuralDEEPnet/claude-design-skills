schema_version: "1.1"
name: heritage-bauhaus-guard
expected_outcome: |
  Trap case (gate open: Bauhaus, Rams, Braun and Helvetica are invoked as sources): the user plants four falsehoods (Bauhaus coined 'form follows function', Rams' 8-pt grid, Helvetica on the 1970 subway manual, a golden-ratio Parthenon). The response corrects Sullivan 1896, does not attribute an 8-pt grid to Rams or Braun, corrects the subway claim (Standard Medium; Helvetica official only in Dec 1989), corrects the Parthenon claim (measured about 2.25), keeps the corrections to at most 120 words, still delivers the design DNA with a declared set and basis tags (the user-stated 8 px is [brief]), bundles no Helvetica and asks at most one question.
