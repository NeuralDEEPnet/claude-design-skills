schema_version: "1.1"
name: heritage-residue-audit
expected_outcome: |
  Audit against a declared set using arithmetic: at a 4 px unit with 44 px exempt as platform-fixed, the outliers are exactly 15, 17, 22 and 30 (residues 1, 1, 2, 2); against a 1.25 type scale from 16 px, 18 and 34 are off the scale while 13, 16, 20, 25 and 31 are on it; at an 8 px unit the outlier set becomes 4, 12, 15, 17, 22, 30 (residues 4, 4, 1, 1, 2, 2). The count is stated as N outliers of M values. It does not call 1.25 wrong or attribute it to a tradition, tags the user-stated values [brief] and 44 px [platform-fixed], and says passing is consistency, not quality. Bash is allowed in this case only, so the arithmetic can be computed.
